name: Sync anthem caption timestamps

on:
  schedule:
    # Run every Sunday at 03:00 UTC so fresh caption data lands before the week
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      countries:
        description: 'Space-separated ISO-3166 codes to sync (blank = all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch YouTube caption timestamps
        run: |
          CODES="${{ github.event.inputs.countries }}"
          if [ -n "$CODES" ]; then
            node scripts/sync-youtube-captions.mjs --out anthem-yt-calibration.json $CODES
          else
            node scripts/sync-youtube-captions.mjs --out anthem-yt-calibration.json
          fi

      - name: Apply calibration to nationalAnthems.ts
        run: |
          if [ -f anthem-yt-calibration.json ]; then
            node scripts/apply-calibration.mjs anthem-yt-calibration.json
          else
            echo "No calibration output — nothing to apply"
          fi

      - name: Commit if timestamps changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/nationalAnthems.ts
          if git diff --staged --quiet; then
            echo "No timestamp changes — nothing to commit"
          else
            CHANGED=$(git diff --staged --stat | tail -1)
            git commit -m "chore(anthems): sync YouTube caption timestamps

Real per-line start times derived from YouTube caption cue timestamps,
replacing the previous uniform-pacing estimates. Fixes lyrics panel
sync drift on all devices including iOS Safari where runtime caption
fetching is blocked by CORS.

$CHANGED"
            git push origin main
          fi
