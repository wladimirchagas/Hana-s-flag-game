name: Sync anthem caption timestamps

# Manual trigger only. YouTube bot-blocks all GitHub Actions runner IPs
# ("Sign in to confirm you're not a bot"), so automated caption fetching
# (InnerTube, timedtext, yt-dlp, Invidious) finds nothing without auth.
# Kept for future use: add a YT_COOKIES secret and pass --cookies to make
# the yt-dlp strategy work. Until then, use the /calibrate page in the app
# to tap-calibrate line timings and apply them with apply-calibration.mjs.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install yt-dlp
        run: pipx install yt-dlp

      - name: Fetch YouTube caption timestamps
        run: node scripts/sync-youtube-captions.mjs --out anthem-yt-calibration.json

      - name: Apply calibration to nationalAnthems.ts
        run: |
          if [ -f anthem-yt-calibration.json ]; then
            node scripts/apply-calibration.mjs anthem-yt-calibration.json
          else
            echo "No calibration output - nothing to apply"
          fi

      - name: Commit if timestamps changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/nationalAnthems.ts
          if git diff --staged --quiet; then
            echo "No timestamp changes - nothing to commit"
          else
            git commit -m "chore(anthems): sync YouTube caption timestamps"
            git push origin main
          fi
