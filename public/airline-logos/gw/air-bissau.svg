  </g>
  <text x="175" y="75" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" fill="#1e293b" letter-spacing="2">AIR BISSAU</text>
  <text x="177" y="106" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#007a3d" letter-spacing="3.5">LINHAS AÉREAS DA GUINÉ-BISSAU</text>
</svg>