<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160">
  <rect width="500" height="160" fill="transparent"/>
  <!-- Air Bissau historic wing roundel -->
  <g transform="translate(35, 20)">
    <circle cx="60" cy="60" r="55" fill="#ce1126"/>
    <circle cx="60" cy="60" r="42" fill="#fcd116"/>
    <!-- Black African star of Guinea-Bissau -->
